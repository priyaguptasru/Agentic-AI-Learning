<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Agentic AI Portal</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Agentic AI Document Portal</h1>

      <!-- PDF Upload -->
      <section class="card">
        <h2>Upload PDF</h2>

        <input type="file" id="pdfFile" accept=".pdf" />

        <button id="uploadPdfBtn">Upload PDF</button>
      </section>

      <!-- CSV Upload -->
      <section class="card">
        <h2>Upload CSV</h2>

        <input type="file" id="csvFile" accept=".csv" />

        <button id="uploadCsvBtn">Upload CSV</button>
      </section>

      <!-- Status -->
      <section class="card">
        <h2>Status</h2>

        <p id="statusMessage">Ready...</p>
      </section>

      <!-- Navigation -->
      <section class="card">
        <h2>Navigation</h2>

        <button onclick="location.href = 'documents.html'">
          View Documents
        </button>

        <button onclick="location.href = 'csv.html'">View CSV Files</button>

      </section>
    </div>

    <script src="../js/api.js"></script>

    <script src="../js/upload.js"></script>
  </body>
</html>
